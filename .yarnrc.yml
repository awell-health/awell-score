changesetBaseRefs:
  - main
  - HEAD

compressionLevel: mixed

enableGlobalCache: false

# This repository commits .yarn/cache (zero-installs), and Yarn only caches
# native binaries for the platform that ran the install. vitest pulls in a
# native rolldown binding, so without this an install on macOS would commit a
# cache that CI (linux-x64) cannot resolve from.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc

yarnPath: .yarn/releases/yarn-4.6.0.cjs
